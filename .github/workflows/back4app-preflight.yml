name: Back4app + Atlas preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: back4app-production
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Atlas configuration presence
        shell: python
        run: |
          import os
          if not os.getenv("MONGO_URI", "").strip():
              raise SystemExit("Missing GitHub secret: MONGO_URI")
          print("Atlas URI is configured (value hidden).")
      - name: Install Atlas verification dependency
        run: python -m pip install --disable-pip-version-check "pymongo>=4.9,<5" dnspython
      - name: Verify MongoDB Atlas
        run: python scripts/verify_atlas.py

  back4app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BACK4APP_ACCOUNT_KEY: ${{ secrets.BACK4APP_API || vars.BACK4APP_API }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Back4app configuration presence
        shell: python
        run: |
          import os
          if not os.getenv("BACK4APP_ACCOUNT_KEY", "").strip():
              raise SystemExit("Missing GitHub configuration: BACK4APP_API")
          print("Back4app account key is configured (value hidden).")
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MCP client
        run: npm install --no-save @modelcontextprotocol/sdk@latest
      - name: Discover authenticated Back4app MCP tools
        run: node scripts/back4app_mcp_discover.mjs
