name: tests

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile application
        run: python -m compileall -q app worker.py

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: ""
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          OPENSKY_CREDENTIALS_JSON: ""
        run: pytest -q

      - name: Verify dependency consistency
        run: pip check
