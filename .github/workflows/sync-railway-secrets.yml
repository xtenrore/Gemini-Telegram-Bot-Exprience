name: Sync Plane secrets to Railway

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-railway-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      SERVICE_ID: af7f738d-0a49-4b86-a96a-86cf22f1b4db
      WORKSPACE_ID: 3fcd544c-7798-4d82-b331-8ea8294ad9e5
      OPENSKY_1: ${{ secrets.OPENSKY_1 }}
      OPENSKY_2: ${{ secrets.OPENSKY_2 }}
      OPENSKY_3: ${{ secrets.OPENSKY_3 }}
      OPENSKY_4: ${{ secrets.OPENSKY_4 }}
      OPENSKY_5: ${{ secrets.OPENSKY_5 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
    steps:
      - name: Validate Railway authentication
        shell: sh
        run: |
          set -eu
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_AUTH_MODE=project" >> "$GITHUB_ENV"
          elif [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "RAILWAY_AUTH_MODE=api" >> "$GITHUB_ENV"
          else
            echo "::error::Missing RAILWAY_TOKEN or RAILWAY_API_TOKEN GitHub secret."
            exit 1
          fi

      - name: Resolve Railway project access
        shell: sh
        run: |
          set -eu
          if [ "${RAILWAY_AUTH_MODE:-}" = "project" ]; then
            echo "Using Railway project-token mode."
            exit 0
          fi

          if railway link \
            --project "$PROJECT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --workspace "$WORKSPACE_ID"; then
            echo "Using Railway API-token mode."
            exit 0
          fi

          # Some older Plane? setups stored a Railway project token under the
          # RAILWAY_API_TOKEN GitHub-secret name. Retry that same masked value
          # under the CLI's project-token variable without exposing it.
          echo "Railway API-token link was rejected; trying project-token compatibility mode."
          echo "RAILWAY_TOKEN=$RAILWAY_API_TOKEN" >> "$GITHUB_ENV"
          echo "RAILWAY_API_TOKEN=" >> "$GITHUB_ENV"
          echo "RAILWAY_AUTH_MODE=project-fallback" >> "$GITHUB_ENV"

      - name: Sync configured Plane secrets
        shell: sh
        run: |
          set -eu
          set --
          found=0
          for name in OPENSKY_1 OPENSKY_2 OPENSKY_3 OPENSKY_4 OPENSKY_5 GEMINI_API_KEY GEMINI_API_KEY_2 GROQ_KEY GROQ_KEY_2; do
            eval "value=\${$name:-}"
            if [ -n "$value" ]; then
              set -- "$@" "$name=$value"
              found=$((found + 1))
            else
              echo "Skipping unset secret: $name"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::None of the Plane provider secrets are configured in GitHub Actions."
            exit 1
          fi

          # A single set command updates all present variables and triggers only
          # one Railway redeploy. Railway reports variable names, not values.
          railway variable set \
            --service "$SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" \
            "$@"

      - name: Verify variable names are present
        shell: sh
        run: |
          set -eu
          railway variable list \
            --service "$SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" \
            --json \
            | grep -E 'OPENSKY_[1-5]|GEMINI_API_KEY_2|GROQ_KEY(_2)?' >/dev/null
          echo "Railway secret variable names verified. Values were not printed."
