name: Deploy v3.2 to Northflank

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: northflank-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      NF_API_TOKEN: ${{ secrets.NF_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
      OPENSKY_CREDENTIALS_JSON: ${{ secrets.OPENSKY_CREDENTIALS_JSON }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NF_REGION: ${{ vars.NF_REGION || 'europe-west' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required secrets
        shell: python
        run: |
          import os
          required = ["NF_API_TOKEN", "TELEGRAM_BOT_TOKEN", "GEMINI_API_KEY"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: " + ", ".join(missing)
                  + ". Add them under Settings > Secrets and variables > Actions."
              )
          print("Required deployment secrets are present.")

      - name: Install deployment client
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1"

      - name: Deploy v3.2
        run: python scripts/deploy_northflank.py
