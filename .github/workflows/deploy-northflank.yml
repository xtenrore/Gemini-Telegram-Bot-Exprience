name: Deploy to Northflank

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: northflank-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      NF_API_TOKEN: ${{ secrets.NF_API_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OPENSKY_CREDENTIALS_JSON: ${{ secrets.OPENSKY_CREDENTIALS_JSON }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SLACK_ALERT_CHANNEL_ID: ${{ vars.SLACK_ALERT_CHANNEL_ID || 'C0C1F7F0KKQ' }}
      ADMIN_SLACK_USER_ID: ${{ vars.ADMIN_SLACK_USER_ID || 'U0C1CG7BSUV' }}
      NF_REGION: ${{ vars.NF_REGION || 'europe-west' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate infrastructure secrets
        shell: python
        run: |
          import os
          required = ["NF_API_TOKEN", "GEMINI_API_KEY"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: " + ", ".join(missing)
                  + ". Add them under Settings > Secrets and variables > Actions."
              )
          slack_ready = bool(
              os.getenv("SLACK_BOT_TOKEN", "").strip()
              and os.getenv("SLACK_APP_TOKEN", "").strip()
          )
          print("Infrastructure secrets are present.")
          print("Slack credentials present:", slack_ready)

      - name: Install deployment client
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1"

      - name: Deploy
        run: python scripts/deploy_northflank.py
