name: Production health watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: plane-production-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_BASE_URL: https://plane-telegram-bot.vercel.app
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENSKY_CREDENTIALS_JSON: ${{ secrets.OPENSKY_CREDENTIALS_JSON }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
    steps:
      - name: Deep production verification
        shell: python
        run: |
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          required = ("TELEGRAM_BOT_TOKEN", "MONGO_URI", "GEMINI_API_KEY")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print("Required production secret configuration is incomplete")
              sys.exit(1)

          base = os.environ["VERCEL_BASE_URL"].rstrip("/")

          # Public liveness first, with a strict latency budget.
          started = time.monotonic()
          try:
              with urllib.request.urlopen(base + "/health", timeout=10) as response:
                  health = json.load(response)
                  health_status = response.status
          except Exception as exc:
              print(f"Public health request failed: {type(exc).__name__}")
              sys.exit(1)
          health_ms = int((time.monotonic() - started) * 1000)
          if health_status != 200 or not health.get("ok"):
              print(f"Public health unhealthy: HTTP {health_status}")
              sys.exit(1)
          print(f"Public health OK ({health_ms} ms)")

          audience = "plane-bot-vercel-bootstrap"
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_url += separator + urllib.parse.urlencode({"audience": audience})
          oidc_req = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(oidc_req, timeout=15) as response:
              oidc = json.load(response)["value"]

          admin_id_raw = os.environ.get("ADMIN_TELEGRAM_ID", "").strip()
          config = {
              "telegram_bot_token": os.environ["TELEGRAM_BOT_TOKEN"],
              "mongo_uri": os.environ["MONGO_URI"],
              "gemini_api_key": os.environ["GEMINI_API_KEY"],
              "generation": os.environ["GITHUB_SHA"],
              "database_name": "aircraft_bot",
              "groq_api_key": os.environ.get("GROQ_API_KEY", ""),
              "opensky_credentials_json": os.environ.get("OPENSKY_CREDENTIALS_JSON", ""),
              "admin_password": os.environ.get("ADMIN_PASSWORD", ""),
              "admin_telegram_id": int(admin_id_raw) if admin_id_raw else None,
          }
          body = json.dumps(config, separators=(",", ":")).encode()
          request = urllib.request.Request(
              base + "/verify",
              data=body,
              headers={
                  "Authorization": f"Bearer {oidc}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          started = time.monotonic()
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  result = json.load(response)
                  status = response.status
          except urllib.error.HTTPError as exc:
              print(f"Deep verification failed safely: HTTP {exc.code}")
              sys.exit(1)
          except Exception as exc:
              print(f"Deep verification request failed: {type(exc).__name__}")
              sys.exit(1)
          verify_ms = int((time.monotonic() - started) * 1000)

          safe = {
              key: result.get(key)
              for key in (
                  "ready",
                  "mongodb",
                  "monitor",
                  "telegram",
                  "telegram_runtime",
                  "webhook",
                  "gemini",
                  "bot_username",
              )
          }
          print("Deep verification:", json.dumps(safe, sort_keys=True))
          print(f"Deep verification latency: {verify_ms} ms")

          if status != 200 or not result.get("ready"):
              sys.exit(1)
          if result.get("bot_username") != "planebotnotifierbot":
              print("Unexpected Telegram bot identity")
              sys.exit(1)
