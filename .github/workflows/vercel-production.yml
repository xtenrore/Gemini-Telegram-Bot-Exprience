name: Railway production secret sync

on:
  push:
    branches:
      - chatgpt/vercel-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container: ghcr.io/railwayapp/cli:latest

    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENSKY_CREDENTIALS_JSON: ${{ secrets.OPENSKY_CREDENTIALS_JSON }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync GitHub secrets to Railway
        shell: sh
        run: |
          chmod +x scripts/sync_railway_secrets.sh
          ./scripts/sync_railway_secrets.sh
