display_information:
  name: Aircraft Alert
  description: Fast aircraft proximity alerts and aviation spotting notifications.
  background_color: "#0B1F33"
features:
  bot_user:
    display_name: Aircraft Alert
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
